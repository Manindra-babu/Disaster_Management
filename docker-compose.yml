version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resq_db
    environment:
      POSTGRES_USER: resq_user
      POSTGRES_PASSWORD: resq_secure_password_2026
      POSTGRES_DB: resq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq_user -d resq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resq_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-resq_user}:${POSTGRES_PASSWORD:-resq_secure_password_2026}@postgres:5432/${POSTGRES_DB:-resq_db}
      SECRET_KEY: ${SECRET_KEY:-resq_super_secure_production_secret_key_2026_xyz}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resq_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
